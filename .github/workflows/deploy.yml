name: Deploy HTML Static to GitHub Pages

on:
  # Berjalan otomatis setiap ada push ke branch main
  push:
    branches: ["main"]
  # Memungkinkan untuk dijalankan secara manual dari tab Actions
  workflow_dispatch:

# Memberikan permission token untuk mendeploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact folder public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
